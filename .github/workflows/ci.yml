name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run static validation and build
        run: npm run validate:phase0 && npm run format:check && npm run lint && npm run typecheck && npm run build
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit tests with the pinned UID and memory-backed scratch
        run: bash scripts/test-encrypted-backup.sh unit
      - name: Verify actual Docker metadata projections
        run: bash scripts/test-docker-projections.sh
      - name: Run hermetic operator-helper test files
        run: |
          python3 -B docs/operations/actions/2026-10-29-promotion-observer-test.py
          python3 -B docs/operations/actions/2026-10-31-reboot-recovery-test.py
          python3 -B docs/operations/actions/2026-10-31-peer-recovery-test.py
          python3 -B docs/operations/actions/2026-10-31-rollback-after-reboot-test.py
          python3 -B docs/operations/actions/2026-10-31-current-runtime-recovery-test.py
          python3 -B docs/operations/actions/2026-11-02-final-server-test.py
