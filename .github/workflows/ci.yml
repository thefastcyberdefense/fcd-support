name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: .node-version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run static validation and build
        run: npm run validate:phase0 && npm run format:check && npm run lint && npm run typecheck && npm run build
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit tests with the pinned UID and memory-backed scratch
        run: bash scripts/test-encrypted-backup.sh unit
