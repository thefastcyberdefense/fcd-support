name: agy SEO and crawler header source-text scaffold

on:
  pull_request:
    paths:
      - 'src/app.ts'
      - 'src/admin/**'
      - 'scripts/verify-seo-contract.ts'
      - '.github/workflows/agy-seo-and-identity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agy-seo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-identity-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || '' }}
      AGY_STRICT_SEO_GATE: ${{ vars.AGY_STRICT_SEO_GATE || 'false' }}
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run source-text crawler noindex contract scaffold (strict=false by default; not live route/SEO verification)
        run: node scripts/verify-seo-contract.ts
