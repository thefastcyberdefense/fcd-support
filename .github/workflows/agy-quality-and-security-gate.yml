name: agy quality and security gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agy-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run Phase 0, formatting, lint, typecheck, and build
        run: |
          npm run validate:phase0
          npm run format:check
          npm run lint
          npm run typecheck
          npm run build
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Run secret and synthetic-fixture policy scan
        run: node scripts/verify-security-policy.ts
      - name: Verify PR handoff and Ralph-GSD story evidence
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/verify-pr-handoff.ts
