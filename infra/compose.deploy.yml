name: fcd-support

x-api-security: &api-security
  read_only: true
  user: 'node'
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    user: 'postgres'
    read_only: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fcd_support}
      POSTGRES_USER: ${POSTGRES_USER:-fcd_support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs:
      - /run/postgresql:size=16m,mode=0775,uid=999,gid=999
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          memory: 256M

  migrate:
    image: fcd-support-api:local
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *api-security
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    command:
      - ./node_modules/.bin/node-pg-migrate
      - up
      - --migrations-dir
      - migrations
      - --migrations-table
      - pgmigrations
      - --database-url-var
      - DATABASE_URL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  fcd-support-api:
    image: fcd-support-api:local
    build:
      context: ..
      dockerfile: Dockerfile
    <<: *api-security
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      HOST: 0.0.0.0
      META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET must be set}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?META_VERIFY_TOKEN must be set}
      NODE_ENV: production
      PORT: '3003'
    expose:
      - '3003'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3003/webhooks/meta',
          response => process.exit(response.statusCode === 403 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - ingress
      - manifest
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          memory: 128M

networks:
  data:
    name: fcd-support-data
    internal: true
  ingress:
    name: fcd-support-ingress
    external: true
  manifest:
    name: mnfst_internal
    external: true

volumes:
  postgres-data:
    name: fcd-support-postgres-data
